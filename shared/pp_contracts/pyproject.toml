[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pp_contracts"
version = "0.1.0"
description = "Shared contracts between PatchPilot backend and sandbox runner"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
strict = true
python_version = "3.11"
